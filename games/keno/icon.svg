<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Medallion -->
  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ring)" stroke-width="16"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="4" opacity=".7"/>
    <circle cx="256" cy="256" r="150" fill="#08231a"/>
  </g>

  <!-- A keno ticket: a corner of numbers, a marked one caught by a gold ball -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <g fill="none" stroke="#e6c869" stroke-width="3" opacity=".55">
      <rect x="150" y="150" width="62" height="62" rx="10"/><rect x="225" y="150" width="62" height="62" rx="10"/><rect x="300" y="150" width="62" height="62" rx="10"/>
      <rect x="150" y="225" width="62" height="62" rx="10"/><rect x="300" y="225" width="62" height="62" rx="10"/>
      <rect x="150" y="300" width="62" height="62" rx="10"/><rect x="225" y="300" width="62" height="62" rx="10"/><rect x="300" y="300" width="62" height="62" rx="10"/>
    </g>
    <g font-size="28" fill="#f4efe2" opacity=".7">
      <text x="181" y="191">7</text><text x="256" y="191">8</text><text x="331" y="191">9</text>
      <text x="181" y="266">17</text><text x="331" y="266">19</text>
      <text x="181" y="341">27</text><text x="256" y="341">28</text><text x="331" y="341">29</text>
    </g>
    <g filter="url(#soft)">
      <circle cx="256" cy="256" r="58" fill="#c8202a" opacity=".55"/>
      <circle cx="256" cy="256" r="46" fill="#e3bd4d" stroke="url(#ring)" stroke-width="4"/>
      <circle cx="256" cy="256" r="30" fill="#fff8ea"/>
      <text x="256" y="270" font-size="38" fill="#17171a">18</text>
    </g>
  </g>
</svg>
