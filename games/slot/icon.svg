<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffefa"/>
      <stop offset="100%" stop-color="#ebe6d8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Medallion -->
  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ring)" stroke-width="16"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="4" opacity=".7"/>
    <circle cx="256" cy="256" r="150" fill="#08231a"/>
  </g>

  <!-- A window of three reels, each on a seven -->
  <g filter="url(#soft)">
    <rect x="132" y="186" width="248" height="140" rx="18" fill="#120b05" stroke="url(#ring)" stroke-width="8"/>
    <rect x="146" y="200" width="68" height="112" rx="8" fill="url(#paper)"/>
    <rect x="222" y="200" width="68" height="112" rx="8" fill="url(#paper)"/>
    <rect x="298" y="200" width="68" height="112" rx="8" fill="url(#paper)"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#c8202a" stroke="#e6c35a" stroke-width="3" text-anchor="middle" paint-order="stroke">
    <text x="180" y="286">7</text>
    <text x="256" y="286">7</text>
    <text x="332" y="286">7</text>
  </g>
</svg>
