<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0%" stop-color="#fbf1c8"/>
      <stop offset="42%" stop-color="#e7c869"/>
      <stop offset="78%" stop-color="#b8902f"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
