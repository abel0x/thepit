      C274 326 268 324 263 320
      C266 340 274 356 292 368
      L220 368
      C238 356 246 340 249 320
      C244 324 238 326 230 326
      C202 326 176 304 176 268
      C176 214 256 150 256 150 Z"/>
    <text x="256" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="700"
          letter-spacing="-16" fill="url(#ring)" text-anchor="middle">21</text>
  </g>
</svg>
