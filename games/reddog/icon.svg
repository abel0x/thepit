<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffefa"/>
      <stop offset="100%" stop-color="#ebe6d8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- No medallion: the drawing fills the tile so that it still reads in a browser tab -->
  <g transform="translate(256 256) scale(1.42) translate(-256 -256)">
    <!-- A four and a jack, and the third card still face down on its red back -->
    <g filter="url(#soft)">
      <rect x="126" y="196" width="92" height="132" rx="11" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
      <text x="172" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#17171a" text-anchor="middle">4</text>
    </g>
    <g filter="url(#soft)">
      <rect x="294" y="196" width="92" height="132" rx="11" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
      <text x="340" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#17171a" text-anchor="middle">J</text>
    </g>
    <g filter="url(#soft)">
      <rect x="205" y="164" width="102" height="146" rx="12" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
      <rect x="213" y="172" width="86" height="130" rx="8" fill="#b3243a" stroke="#f0a0aa" stroke-width="3"/>
      <path d="M256 209L276 237L256 265L236 237Z" fill="none" stroke="#f0a0aa" stroke-width="4"/>
    </g>
  </g>
</svg>
