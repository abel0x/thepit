<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffefa"/>
      <stop offset="100%" stop-color="#ebe6d8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- No medallion: the drawing fills the tile so that it still reads in a browser tab -->
  <g transform="translate(256 256) scale(1.42) translate(-256 -256)">
    <!-- Three cards fanned in the hand, two on a purple back and a three turned up -->
    <g filter="url(#soft)" transform="rotate(-20 256 360)">
      <rect x="196" y="160" width="120" height="172" rx="13" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
      <rect x="205" y="169" width="102" height="154" rx="9" fill="#6b3aa0" stroke="#c4a2ea" stroke-width="3"/>
      <path d="M256 212.4L280 246L256 279.6L232 246Z" fill="none" stroke="#c4a2ea" stroke-width="4"/>
    </g>
    <g filter="url(#soft)">
      <rect x="196" y="156" width="120" height="172" rx="13" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
      <rect x="205" y="165" width="102" height="154" rx="9" fill="#6b3aa0" stroke="#c4a2ea" stroke-width="3"/>
      <path d="M256 208.4L280 242L256 275.6L232 242Z" fill="none" stroke="#c4a2ea" stroke-width="4"/>
    </g>
    <g filter="url(#soft)" transform="rotate(20 256 360)">
      <rect x="196" y="160" width="124" height="176" rx="14" fill="url(#paper)" stroke="url(#ring)" stroke-width="4"/>
      <text x="258" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" fill="#b7151e" text-anchor="middle">3</text>
      <text x="214" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#b7151e">3</text>
    </g>
  </g>
</svg>
