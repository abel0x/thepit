<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1e8cf"/>
      <stop offset="100%" stop-color="#b9b29d"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Three rows of pegs, a ball on its way down and three slots, drawn
       large enough to read in a browser tab -->
  <g fill="url(#ring)" filter="url(#soft)">
    <circle cx="256" cy="120" r="22"/>
    <circle cx="196" cy="200" r="22"/><circle cx="316" cy="200" r="22"/>
    <circle cx="136" cy="280" r="22"/><circle cx="256" cy="280" r="22"/><circle cx="376" cy="280" r="22"/>
  </g>
  <g filter="url(#soft)">
    <rect x="86" y="338" width="100" height="72" rx="16" fill="#b3243a"/>
    <rect x="206" y="338" width="100" height="72" rx="16" fill="#b08a2e"/>
    <rect x="326" y="338" width="100" height="72" rx="16" fill="#b3243a"/>
    <circle cx="226" cy="158" r="36" fill="url(#ball)"/>
  </g>
</svg>
