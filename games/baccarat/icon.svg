<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffefa"/>
      <stop offset="100%" stop-color="#ebe6d8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- No medallion: the drawing fills the tile so that it still reads in a browser tab -->
  <g transform="translate(256 256) scale(1.42) translate(-256 -256)">
    <!-- The Banker's card, still on its amber back, behind the Player's nine -->
    <g filter="url(#soft)" transform="rotate(-14 214 262)">
      <rect x="150" y="166" width="126" height="180" rx="14" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
      <rect x="159" y="175" width="108" height="162" rx="10" fill="#c0661f" stroke="#f3c48f" stroke-width="3"/>
      <path d="M213 221L238 256L213 291L188 256Z" fill="none" stroke="#f3c48f" stroke-width="4"/>
    </g>
    <g filter="url(#soft)" transform="rotate(11 300 258)">
      <rect x="236" y="160" width="130" height="186" rx="14" fill="url(#paper)" stroke="url(#ring)" stroke-width="4"/>
      <text x="301" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" fill="#b7151e" text-anchor="middle">9</text>
      <text x="258" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#b7151e">9</text>
    </g>
  </g>
</svg>
