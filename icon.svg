    <path fill="url(#gold)" d="M244.7 0L387 195.7A94 94 0 0 1 275 337.9L245 325.1L273.3 394.1L179.8 394.1L293 109.4L55.7 296.6L206.8 227.5L161.8 394.1L119 394.1L144 344.1L63.9 344.1A63.9 63.9 0 0 1 17.8 235.9Z"/>
