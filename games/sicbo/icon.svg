<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Medallion -->
  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ring)" stroke-width="16"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="4" opacity=".7"/>
    <circle cx="256" cy="256" r="150" fill="#08231a"/>
  </g>

  <!-- Three dice, a six, a six and a six: eighteen -->
  <g filter="url(#soft)" transform="rotate(-12 196 290)">
    <rect x="146" y="240" width="100" height="100" rx="20" fill="#c8202a" stroke="url(#ring)" stroke-width="4"/>
    <circle cx="171" cy="262" r="8.5" fill="#fff8ea"/><circle cx="221" cy="262" r="8.5" fill="#fff8ea"/><circle cx="171" cy="290" r="8.5" fill="#fff8ea"/><circle cx="221" cy="290" r="8.5" fill="#fff8ea"/><circle cx="171" cy="318" r="8.5" fill="#fff8ea"/><circle cx="221" cy="318" r="8.5" fill="#fff8ea"/>
  </g>
  <g filter="url(#soft)" transform="rotate(10 316 290)">
    <rect x="266" y="240" width="100" height="100" rx="20" fill="#c8202a" stroke="url(#ring)" stroke-width="4"/>
    <circle cx="291" cy="262" r="8.5" fill="#fff8ea"/><circle cx="341" cy="262" r="8.5" fill="#fff8ea"/><circle cx="291" cy="290" r="8.5" fill="#fff8ea"/><circle cx="341" cy="290" r="8.5" fill="#fff8ea"/><circle cx="291" cy="318" r="8.5" fill="#fff8ea"/><circle cx="341" cy="318" r="8.5" fill="#fff8ea"/>
  </g>
  <g filter="url(#soft)" transform="rotate(-2 256 198)">
    <rect x="206" y="148" width="100" height="100" rx="20" fill="#c8202a" stroke="url(#ring)" stroke-width="4"/>
    <circle cx="231" cy="170" r="8.5" fill="#fff8ea"/><circle cx="281" cy="170" r="8.5" fill="#fff8ea"/><circle cx="231" cy="198" r="8.5" fill="#fff8ea"/><circle cx="281" cy="198" r="8.5" fill="#fff8ea"/><circle cx="231" cy="226" r="8.5" fill="#fff8ea"/><circle cx="281" cy="226" r="8.5" fill="#fff8ea"/>
  </g>
</svg>
