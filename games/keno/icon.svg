<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1e8cf"/>
      <stop offset="100%" stop-color="#b9b29d"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A drawn ball with the machine's own number, in the corners of a ticket -->
  <g fill="none" stroke="#e6c869" stroke-width="5" opacity=".5">
    <rect x="62" y="62" width="104" height="104" rx="18"/><rect x="346" y="62" width="104" height="104" rx="18"/>
    <rect x="62" y="346" width="104" height="104" rx="18"/><rect x="346" y="346" width="104" height="104" rx="18"/>
  </g>
  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="150" fill="#c8202a"/>
    <circle cx="256" cy="256" r="124" fill="url(#ball)" stroke="url(#ring)" stroke-width="8"/>
    <text x="256" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="700"
          fill="#17171a" text-anchor="middle">80</text>
  </g>
</svg>
