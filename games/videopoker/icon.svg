<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffefa"/>
      <stop offset="100%" stop-color="#ebe6d8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- No medallion: the drawing fills the tile so that it still reads in a browser tab -->
  <g transform="translate(256 256) scale(1.3) translate(-256 -256)">
    <!-- The machine's screen in its gold bezel -->
    <rect x="92" y="128" width="328" height="252" rx="24" fill="#0b0b0e" stroke="url(#ring)" stroke-width="10" filter="url(#soft)"/>
    <!-- Five cards of a royal flush fanned on it, the jack in front -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#17171a">
      <g filter="url(#soft)" transform="rotate(-30 256 380)">
        <rect x="206" y="168" width="100" height="144" rx="11" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
        <text x="220" y="206" font-size="32">10</text>
      </g>
      <g filter="url(#soft)" transform="rotate(-15 256 380)">
        <rect x="206" y="164" width="100" height="144" rx="11" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
        <text x="220" y="202" font-size="32">Q</text>
      </g>
      <g filter="url(#soft)" transform="rotate(15 256 380)">
        <rect x="206" y="164" width="100" height="144" rx="11" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
        <text x="220" y="202" font-size="32">K</text>
      </g>
      <g filter="url(#soft)" transform="rotate(30 256 380)">
        <rect x="206" y="168" width="100" height="144" rx="11" fill="url(#paper)" stroke="#8c6a1c" stroke-width="3"/>
        <text x="220" y="206" font-size="32">A</text>
      </g>
      <g filter="url(#soft)">
        <rect x="202" y="156" width="108" height="154" rx="12" fill="url(#paper)" stroke="url(#ring)" stroke-width="4"/>
        <text x="256" y="268" font-size="92" fill="#b7151e" text-anchor="middle">J</text>
        <text x="216" y="194" font-size="30" fill="#b7151e">J</text>
      </g>
    </g>
  </g>
</svg>
