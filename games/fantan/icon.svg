<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15402e"/>
      <stop offset="58%" stop-color="#0a2419"/>
      <stop offset="100%" stop-color="#04110b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecc0"/>
      <stop offset="28%" stop-color="#e6c869"/>
      <stop offset="52%" stop-color="#b8902f"/>
      <stop offset="74%" stop-color="#f0dd9a"/>
      <stop offset="100%" stop-color="#8c6a1c"/>
    </linearGradient>
    <radialGradient id="bead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#efe8d6"/>
      <stop offset="100%" stop-color="#b9ad8c"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Medallion -->
  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ring)" stroke-width="16"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="4" opacity=".7"/>
    <circle cx="256" cy="256" r="150" fill="#08231a"/>
  </g>

  <!-- The brass plate, a few beads and four taken away with the stick -->
  <circle cx="246" cy="262" r="104" fill="#4a2f13" stroke="url(#ring)" stroke-width="10" filter="url(#soft)"/>
  <g fill="url(#bead)">
    <circle cx="216" cy="238" r="17"/><circle cx="252" cy="226" r="17"/><circle cx="234" cy="270" r="17"/>
    <circle cx="198" cy="282" r="17"/><circle cx="270" cy="262" r="17"/>
  </g>
  <g fill="url(#bead)" opacity=".55">
    <circle cx="300" cy="306" r="14"/><circle cx="330" cy="292" r="14"/><circle cx="322" cy="326" r="14"/><circle cx="292" cy="338" r="14"/>
  </g>
  <path d="M150 368 L372 176" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" filter="url(#soft)"/>
</svg>
